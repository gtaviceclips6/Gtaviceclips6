name: Virales al momento
# Cada hora (de 9:35 a 01:35 en Madrid): lo que esta explotando AHORA.
#  1) Clips de Twitch en español de las ultimas 6 h ordenados por visitas/hora (la IA solo deja pasar los graciosos).
#  2) Tendencias de Google en España -> video "VIRAL HOY" si hay algo divertido (nunca sucesos ni politica).
on:
  schedule:
    - cron: "35 7-23 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bot-gtaviceclips6
  cancel-in-progress: false
jobs:
  virales:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-medium-v1
      - name: Instalar herramientas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q -U -r bot/requirements.txt
          mkdir -p fonts
          curl -sSL -o fonts/Anton-Regular.ttf https://github.com/google/fonts/raw/main/ofl/anton/Anton-Regular.ttf || rm -f fonts/Anton-Regular.ttf
      - name: Clips virales recien salidos
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          SOLO_VIRALES: "true"
          HORAS_VIRALES: "6"
          MAX_VIRALES: "6"
          MAX_CLIPS: "6"
          NOTA_MINIMA: "7"
          EVENTO: "virales"
        run: python bot/cortar.py
      - name: Tendencias virales de España
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODO_NOTICIAS: "virales"
          HORAS_NOTICIA: "6"
        run: python bot/noticias.py
      - name: Guardar
        if: always()
        run: |
          git config user.name "vice-bot"
          git config user.email "vice-bot@users.noreply.github.com"
          for f in hechos.txt shorts telegram_chat.txt ia_estado.txt estado_virales.txt aprobados.jsonl descartados.txt errores.txt noticias_vistas.txt errores_noticias.txt; do git add "$f" 2>/dev/null || true; done
          git diff --cached --quiet || (git commit -m "Virales" && for i in 1 2 3; do git pull --rebase -X theirs -q && git push && break; sleep 5; done)
