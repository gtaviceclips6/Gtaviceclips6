name: Cortar shorts
on:
  push:
    paths:
      - "clips.txt"
      - "streamers.txt"
      - "bot/**"
      - ".github/workflows/cortar-shorts.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cortar-shorts
  cancel-in-progress: false
jobs:
  cortar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar herramientas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q -U yt-dlp faster-whisper requests pillow
          mkdir -p fonts
          curl -sSL -o fonts/Anton-Regular.ttf https://github.com/google/fonts/raw/main/ofl/anton/Anton-Regular.ttf || rm -f fonts/Anton-Regular.ttf
      - name: Cortar y mandar a Telegram
        if: hashFiles('bot/cortar.py') != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAX_CLIPS: "5"
        run: python bot/cortar.py
      - name: Apuntar lo ya hecho
        if: always()
        run: |
          git config user.name "vice-bot"
          git config user.email "vice-bot@users.noreply.github.com"
          git add hechos.txt 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Clips procesados" && git pull --rebase -q && git push)
