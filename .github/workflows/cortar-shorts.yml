name: Cortar shorts
on:
  push:
    paths:
      - "clips.txt"
      - "streamers.txt"
      - "config.json"
      - "bot/**"
      - ".github/workflows/cortar-shorts.yml"
  # Pasada automatica cada 3 horas (hora UTC). Antes del 18/11 busca clips de la ultima
  # semana; desde el 18/11 solo los del ultimo dia (modo lanzamiento).
  # La pasada de las 21:17 UTC (23:17 en Madrid) manda ademas el resumen del dia.
  schedule:
    - cron: "17 */3 * * *"
  # Boton "Run workflow" en GitHub (Actions -> Cortar shorts)
  workflow_dispatch:
    inputs:
      rango:
        description: "Desde cuándo buscar clips en Twitch (24hr, 7d, 30d, all). Vacío = automático"
        required: false
        default: ""
      simulacro:
        description: "Simulacro con GTA 5 (los clips llegan marcados y se descartan solos)"
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
concurrency:
  group: bot-gtaviceclips6
  cancel-in-progress: false
jobs:
  cortar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/requirements.txt
      - name: Guardar el modelo de subtítulos entre pasadas (ahorra minutos)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-medium-v1
      - name: Instalar herramientas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q -U -r bot/requirements.txt
          mkdir -p fonts
          curl -sSL -o fonts/Anton-Regular.ttf https://github.com/google/fonts/raw/main/ofl/anton/Anton-Regular.ttf || rm -f fonts/Anton-Regular.ttf
      - name: Cortar y mandar a Telegram
        if: hashFiles('bot/cortar.py') != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}         # gratis: textos con IA de Google
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}     # para buscar los clips top en español
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          TOP_ESPANOL: "true"
          VIRALES: "true"        # ademas de GTA: los clips en español mas vistos del dia (cualquier tema)
          MAX_VIRALES: "12"
          JUEGO_TOP: ${{ github.event.inputs.simulacro == 'true' && 'Grand Theft Auto V' || 'Grand Theft Auto VI' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # opcional: textos escritos por IA
          GITHUB_TOKEN: ${{ github.token }}                     # para contar los minutos gastados
          EVENTO: ${{ github.event_name }}
          RANGO: ${{ github.event.inputs.rango }}
          SIMULACRO: ${{ github.event.inputs.simulacro }}
          FILTRO: ${{ github.event.inputs.simulacro == 'true' && 'gta|grand theft auto|rp' || '' }}
          MAX_CLIPS: "20"        # clips que mira por pasada (la IA solo deja pasar los buenos)
          NOTA_MINIMA: "7"       # nota minima (1-10) que pone la IA para mandarte un clip
          POR_STREAMER: "3"
          MIN_VISTAS: "0"        # sube este numero si llegan demasiados clips flojos
          MIN_PALABRAS: "3"      # clips donde casi no se habla se descartan
        run: python bot/cortar.py
      - name: Guardar lo hecho en el repositorio
        if: always()
        run: |
          git config user.name "vice-bot"
          git config user.email "vice-bot@users.noreply.github.com"
          for f in hechos.txt shorts telegram_chat.txt ia_estado.txt estado_busqueda.txt estado_virales.txt aprobados.jsonl descartados.txt errores.txt; do git add "$f" 2>/dev/null || true; done
          git diff --cached --quiet || (git commit -m "Clips procesados" && git pull --rebase -q && git push)
