name: Botones de Telegram
# El bot ESCUCHA Telegram todo el rato y responde al momento a los botones ✅/❌, al menú y a los enlaces.
# Cada turno dura ~5 h 40 min; cada 30 min queda otro en cola para relevarlo sin cortes.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: botones
  cancel-in-progress: false
jobs:
  escuchar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Escuchar Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          DURACION_MIN: "340"
        run: |
          pip install -q requests
          git config user.name "vice-bot"
          git config user.email "vice-bot@users.noreply.github.com"
          PYTHONPATH=bot python bot/escuchar.py
