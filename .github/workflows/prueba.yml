name: Prueba Telegram
on:
  push:
    paths:
      - ".github/workflows/prueba.yml"
  workflow_dispatch:
jobs:
  saludo:
    runs-on: ubuntu-latest
    steps:
      - name: Mandar mensaje de prueba
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "❌ Falta el secreto TELEGRAM_BOT_TOKEN"
            exit 1
          fi
          ME=$(curl -sS "https://api.telegram.org/bot${TOKEN}/getMe")
          if [ "$(echo "$ME" | jq -r '.ok')" != "true" ]; then
            echo "❌ El token TELEGRAM_BOT_TOKEN no es valido"
            exit 1
          fi
          if [ -z "$CHAT_ID" ]; then
            CHAT_ID=$(curl -sS "https://api.telegram.org/bot${TOKEN}/getUpdates" | jq -r '[(.result // [])[] | .message.chat.id // empty] | last // empty')
          fi
          if [ -z "$CHAT_ID" ]; then
            echo "❌ No encuentro tu chat: escribe /start a tu bot y vuelve a lanzarlo"
            exit 1
          fi
          curl -sS --fail-with-body -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            --data-urlencode text="✅ ¡Hola! Soy el bot de Vice GTA6 Clips. Ya estoy conectado."
